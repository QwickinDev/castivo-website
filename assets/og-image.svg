<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1612"/>
      <stop offset="100%" stop-color="#14110F"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="20%" cy="40%">
      <stop offset="0%" stop-color="#B9491A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B9491A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orangeGlow" cx="80%" cy="80%">
      <stop offset="0%" stop-color="#F26B1F" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F26B1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F26B1F"/>
      <stop offset="100%" stop-color="#B9491A"/>
    </linearGradient>
    <linearGradient id="waveG" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF6EE"/>
      <stop offset="100%" stop-color="#FFF6EE"/>
    </linearGradient>
  </defs>

  <!-- Dark background with glows -->
  <rect width="1200" height="630" fill="url(#bgg)"/>
  <rect width="1200" height="630" fill="url(#purpleGlow)"/>
  <rect width="1200" height="630" fill="url(#orangeGlow)"/>

  <!-- Logo: icon mark + wordmark -->
  <g transform="translate(80, 130)">
    <!-- Icon -->
    <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#iconG)"/>
    <rect x="16" y="22" width="68" height="56" rx="7" fill="none" stroke="#FFFFFF" stroke-width="6"/>
    <g transform="translate(28, 40)">
      <circle cx="0" cy="28" r="3.5" fill="url(#waveG)"/>
      <path d="M 0 20 A 8 8 0 0 1 8 28" fill="none" stroke="url(#waveG)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 0 12 A 16 16 0 0 1 16 28" fill="none" stroke="url(#waveG)" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <!-- Wordmark -->
    <text x="125" y="86" font-family="'Satoshi', sans-serif" font-weight="900" font-size="80" fill="#FFF6EE" letter-spacing="-3">castivo</text>
    <circle cx="362" cy="35" r="8" fill="#F26B1F"/>
  </g>

  <!-- Headline -->
  <text x="80" y="320" font-family="'Satoshi', sans-serif" font-weight="900" font-size="86" fill="#FFF6EE" letter-spacing="-3">Digital signage</text>
  <text x="80" y="410" font-family="'Satoshi', sans-serif" font-weight="900" font-size="86" fill="#F26B1F" letter-spacing="-3">that just works.</text>

  <!-- Sub -->
  <text x="80" y="475" font-family="'Satoshi', sans-serif" font-weight="500" font-size="26" fill="rgba(255,246,238,0.7)">Software-only · Runs on your Android TV · From $9 AUD per screen per month</text>

  <!-- CTA pill -->
  <rect x="80" y="510" width="220" height="60" rx="30" fill="#F26B1F"/>
  <text x="190" y="549" text-anchor="middle" font-family="'Satoshi', sans-serif" font-weight="700" font-size="18" fill="#FFF6EE">Start free →</text>

  <!-- URL bottom right -->
  <text x="1120" y="585" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="14" fill="rgba(255,246,238,0.4)" letter-spacing="2">CASTIVO.COM.AU</text>

  <!-- Decorative TV mockup -->
  <g transform="translate(720, 210)" opacity="0.95">
    <rect x="0" y="0" width="380" height="220" rx="12" fill="#0a0907"/>
    <rect x="14" y="14" width="352" height="180" rx="6" fill="#F26B1F"/>
    <text x="40" y="80" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFF6EE" opacity="0.8" letter-spacing="2">TODAY'S SPECIAL</text>
    <text x="40" y="130" font-family="'Satoshi', sans-serif" font-weight="900" font-size="40" fill="#FFF6EE" letter-spacing="-1.5">Flat white</text>
    <text x="40" y="170" font-family="'Satoshi', sans-serif" font-weight="900" font-size="40" fill="#FFF6EE" letter-spacing="-1.5">+ croissant</text>
    <rect x="280" y="135" width="74" height="44" rx="6" fill="#FFF6EE"/>
    <text x="317" y="166" text-anchor="middle" font-family="'Satoshi', sans-serif" font-weight="900" font-size="28" fill="#F26B1F">$9</text>
  </g>
</svg>
